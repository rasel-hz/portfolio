<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raseel</title>
<style>
  :root{
    --bg:#0a0a14; --card:rgba(255,255,255,.04); --line:rgba(255,255,255,.1);
    --txt:#f4f4f8; --muted:#9a9cb8;
    --gold:#f5d76e; --violet:#7c6cff; --violet2:#b3a9ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:radial-gradient(1000px 500px at 50% -10%,#1b1c3d 0%,var(--bg) 65%);
    color:var(--txt);min-height:100vh;display:flex;flex-direction:column;
    justify-content:center;overflow-x:hidden;
  }
  header{text-align:center;margin-top:40px}
  h1{font-size:clamp(24px,4vw,44px);line-height:1.3;font-weight:700}
  h1 span{background:linear-gradient(90deg,var(--gold),var(--violet2));-webkit-background-clip:text;color:transparent}

  .stage{
    width:min(1100px,94%);margin:30px auto 60px;
    display:grid;grid-template-columns:1fr 240px 1fr;gap:24px;align-items:center;
  }
  .card{
    position:relative;display:block;min-height:340px;border-radius:22px;padding:24px;
    background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;
    transition:transform .35s ease, box-shadow .35s ease, border-color .35s;
  }
  .card:hover,.card:focus-visible{transform:translateY(-8px)}
  .card.a:hover,.card.a:focus-visible{border-color:var(--gold);box-shadow:0 0 50px rgba(245,215,110,.3)}
  .card.b:hover,.card.b:focus-visible{border-color:var(--violet);box-shadow:0 0 50px rgba(124,108,255,.35)}

  .badge{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;font-weight:700;margin-bottom:16px}
  .a .badge{background:var(--gold);color:#1a1a1a}
  .b .badge{background:var(--violet);color:#fff}

  .preview{height:200px;border-radius:14px;background:rgba(0,0,0,.35);padding:14px;
    display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .lines{display:flex;flex-direction:column;justify-content:center;gap:10px}
  .lines i{display:block;height:8px;border-radius:8px;background:rgba(255,255,255,.12)}
  .lines i:first-child{width:80%}
  .a .lines i:first-child{background:var(--gold)}
  .b .lines i:first-child{background:var(--violet2)}
  .thumb{border-radius:10px}
  .a .thumb{background:linear-gradient(160deg,#c59a5c,#5a3a22 60%,#1d1a2a)}
  .b .thumb{background:linear-gradient(160deg,#6d7cff,#1e2148 60%,#0c0e22)}

  .card h2{font-size:20px;margin:18px 0 6px}
  .card p{color:var(--muted);font-size:14px;line-height:1.6}
  .arrow{position:absolute;bottom:20px;left:20px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px}
  .a .arrow{background:var(--gold);color:#1a1a1a}
  .b .arrow{background:var(--violet);color:#fff}

  /* character */
  .figure{display:flex;flex-direction:column;align-items:center}
  .figure img{width:220px;height:auto;transition:transform .4s ease}
  .figure.pickA img{animation:bob .45s ease-in-out infinite alternate;transform-origin:50% 100%}
  .figure.pickB img{animation:bob .45s ease-in-out infinite alternate;transform-origin:50% 100%}
  .figure.pickA img{transform:rotate(-6deg)}
  .figure.pickB img{transform:rotate(6deg)}
  @keyframes bob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(-6deg)}}
  .label{margin-top:10px;font-size:14px;color:var(--muted);min-height:22px}

  @media (max-width:820px){
    .stage{grid-template-columns:1fr;gap:28px}
    .figure{order:-1}
    .card{min-height:0}
  }
</style>
</head>
<body>

<header>
  <h1><span>Raseel</span> experiencing the power<br>of a strong prompt</h1>
</header>

<main class="stage">
  <a class="card a" id="cardA" href="https://claude.ai/artifact/Xo82UX88CsaA849wApNqSb">
    <div class="badge">A</div>
    <div class="preview">
      <div class="lines"><i></i><i></i><i></i><i></i></div>
      <div class="thumb"></div>
    </div>
    <h2>النسخة الأولى</h2>
    <p>معاينة الصفحة A.</p>
    <span class="arrow">←</span>
  </a>

  <div class="figure" id="figure">
    <img id="char" src="character.png" alt="">
    <div class="label" id="label">مرّر الماوس على A أو B</div>
  </div>

  <a class="card b" id="cardB" href="https://rasel-hz.github.io/portfolio/">
    <div class="badge">B</div>
    <div class="preview">
      <div class="lines"><i></i><i></i><i></i><i></i></div>
      <div class="thumb"></div>
    </div>
    <h2>النسخة الثانية</h2>
    <p>معاينة الصفحة B.</p>
    <span class="arrow">←</span>
  </a>
</main>

<script>
  const fig = document.getElementById('figure');
  const label = document.getElementById('label');
  const idle = 'مرّر الماوس على A أو B';
  const set = (cls, text) => {
    fig.classList.remove('pickA','pickB');
    if (cls) fig.classList.add(cls);
    label.textContent = text;
  };
  const a = document.getElementById('cardA');
  const b = document.getElementById('cardB');
  a.addEventListener('pointerenter', () => set('pickA', 'الصفحة A'));
  a.addEventListener('pointerleave', () => set(null, idle));
  b.addEventListener('pointerenter', () => set('pickB', 'الصفحة B'));
  b.addEventListener('pointerleave', () => set(null, idle));
</script>
</body>
</html>
